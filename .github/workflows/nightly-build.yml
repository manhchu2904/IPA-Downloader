name: Nightly Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration (Release or Debug)"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  nightly-ios:
    name: Build Nightly IPA
    runs-on: macos-26
    env:
      BUILD_CONFIG: ${{ inputs.configuration || 'Release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Stamp Nightly build version into Info.plist
        id: version
        run: |
          BASE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" iOS/DLiPA2/Info.plist)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${SHORT_SHA}"
          BUILD_NUMBER="${{ github.run_number }}"

          echo "Nightly Version: ${NIGHTLY_VERSION} (Build: ${BUILD_NUMBER})"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NIGHTLY_VERSION}" iOS/DLiPA2/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" iOS/DLiPA2/Info.plist

          echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Install build tools (cmake, xcodegen, gomobile)
        run: |
          brew install cmake xcodegen
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialize gomobile
        run: gomobile init

      - name: Build libunicorn.a and Ipatoolbridge.xcframework (${{ env.BUILD_CONFIG }})
        run: |
          chmod +x scripts/build-xcframework.sh
          if [ "$BUILD_CONFIG" = "Debug" ]; then
            ./scripts/build-xcframework.sh --debug
          else
            ./scripts/build-xcframework.sh
          fi

      - name: Generate Xcode project
        working-directory: iOS
        run: xcodegen generate

      - name: Build unsigned iOS app (${{ env.BUILD_CONFIG }}, arm64)
        working-directory: iOS
        run: |
          xcodebuild \
            -project DLiPA2.xcodeproj \
            -scheme DLiPA2 \
            -configuration "$BUILD_CONFIG" \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.nightly_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package Nightly IPA
        working-directory: iOS
        run: |
          APP_PATH="build/Build/Products/${BUILD_CONFIG}-iphoneos/DLiPA2.app"
          codesign --force --sign - --entitlements DLiPA2/DLiPA2.entitlements --timestamp=none "$APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -r "../IPADownloader-Nightly-${{ steps.version.outputs.short_sha }}-${BUILD_CONFIG}.ipa" Payload

      - name: Upload Nightly IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: IPADownloader-Nightly-${{ steps.version.outputs.short_sha }}-${{ env.BUILD_CONFIG }}-IPA
          path: iOS/IPADownloader-Nightly-${{ steps.version.outputs.short_sha }}-${{ env.BUILD_CONFIG }}.ipa
          retention-days: 14
