name: Cleanup Workflow Runs

on:
  workflow_dispatch:
    inputs:
      keep_latest:
        description: "Số lượng lượt chạy mới nhất cần giữ lại cho mỗi workflow (nhập 0 để xóa toàn bộ lịch sử cũ)"
        required: true
        default: "3"
        type: string
      delete_obsolete_only:
        description: "Chỉ xóa các lượt chạy thất bại / đã hủy / thuộc workflow cũ đã bị xóa"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  cleanup-runs:
    name: Delete Old Workflow Runs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      KEEP_LATEST: ${{ inputs.keep_latest != '' && inputs.keep_latest || '3' }}
      OBSOLETE_ONLY: ${{ inputs.delete_obsolete_only || 'false' }}
      CURRENT_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clean up old and obsolete workflow runs
        run: |
          set -euo pipefail

          if ! [[ "$KEEP_LATEST" =~ ^[0-9]+$ ]]; then
            echo "Error: keep_latest phải là số nguyên >= 0 (nhận được: '$KEEP_LATEST')" >&2
            exit 1
          fi

          echo "==> Repository: $REPO"
          echo "==> Keep latest per active workflow: $KEEP_LATEST"
          echo "==> Delete obsolete/failed only: $OBSOLETE_ONLY"

          ACTIVE_PATHS=$(find .github/workflows -maxdepth 1 \( -name "*.yml" -o -name "*.yaml" \) | sed 's|^\./||' | sort)
          echo "==> Active workflow files:"
          echo "$ACTIVE_PATHS"

          # Lấy toàn bộ runs qua /actions/runs (vì /actions/workflows không trả về các workflow đã bị xóa)
          # và lưu ra file trước khi xóa để tránh lệch trang (pagination shift) khi đang xóa.
          RUNS_FILE=$(mktemp)
          trap 'rm -f "$RUNS_FILE"' EXIT

          gh api "repos/${REPO}/actions/runs?per_page=100" --paginate \
            | jq -s -r '[.[].workflow_runs[]] | sort_by(.created_at) | reverse | .[] | "\(.id)|\(.path // "")|\(.status // "")|\(.conclusion // "")|\(.name // "")"' \
            > "$RUNS_FILE"

          TOTAL_RUNS=$(wc -l < "$RUNS_FILE" | tr -d ' ')
          echo "==> Tổng số workflow runs tìm thấy: $TOTAL_RUNS"

          declare -A KEEP_COUNT=()
          DELETED=0
          FAILED=0
          SKIPPED=0

          delete_run() {
            local run_id="$1"
            local reason="$2"
            echo "   Deleting run #${run_id} (${reason})"
            if gh api -X DELETE "repos/${REPO}/actions/runs/${run_id}" </dev/null >/dev/null; then
              DELETED=$((DELETED + 1))
            else
              echo "   [WARN] Không thể xóa run #${run_id}" >&2
              FAILED=$((FAILED + 1))
            fi
          }

          while IFS='|' read -r RUN_ID RUN_PATH STATUS CONCLUSION WF_NAME; do
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "$CURRENT_RUN_ID" ] || [ "$STATUS" != "completed" ]; then
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # 1. Xóa toàn bộ lượt chạy của các workflow đã bị xóa khỏi .github/workflows/
            if [ -z "$RUN_PATH" ] || ! printf '%s\n' "$ACTIVE_PATHS" | grep -Fxq "$RUN_PATH"; then
              delete_run "$RUN_ID" "obsolete workflow: ${WF_NAME} (${RUN_PATH:-unknown})"
              continue
            fi

            # 2. Luôn xóa các lượt chạy bị lỗi (failure), bị hủy (cancelled), bỏ qua (skipped) hoặc timeout
            if [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ] || [ "$CONCLUSION" = "skipped" ] || [ "$CONCLUSION" = "timed_out" ] || [ "$CONCLUSION" = "startup_failure" ]; then
              delete_run "$RUN_ID" "${WF_NAME} - ${CONCLUSION}"
              continue
            fi

            if [ "$OBSOLETE_ONLY" = "true" ]; then
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # 3. Giữ lại tối đa KEEP_LATEST lượt chạy mới nhất cho mỗi workflow hiện hành
            COUNT=$(( ${KEEP_COUNT["$RUN_PATH"]:-0} + 1 ))
            KEEP_COUNT["$RUN_PATH"]=$COUNT

            if [ "$COUNT" -gt "$KEEP_LATEST" ]; then
              delete_run "$RUN_ID" "${WF_NAME} - vượt quá giới hạn giữ lại ${KEEP_LATEST} bản (#${COUNT})"
            else
              SKIPPED=$((SKIPPED + 1))
            fi
          done < "$RUNS_FILE"

          echo "==> Hoàn tất: đã xóa ${DELETED}, giữ lại/bỏ qua ${SKIPPED}, lỗi ${FAILED}."
